<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
	The fonts of the browser that takes the documentation pictures (`bun run docs:shots`): the
	rendering settings of the e2e browser (fonts.conf), but `system-ui`, the first family of the
	application's font stack, and the generic sans-serif resolve to Noto Sans, so the pictures show
	a proportional sans-serif face. The e2e fonts stay as they are (the visual baselines).
-->
<fontconfig>
	<dir>/usr/share/fonts</dir>
	<dir>/usr/local/share/fonts</dir>
	<cachedir prefix="xdg">biblioviva-docs-fontconfig</cachedir>
	<match target="font">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="hinting" mode="assign"><bool>false</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
		<edit name="rgba" mode="assign"><const>none</const></edit>
		<edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
	</match>
	<!-- Chromium resolves `system-ui` through the plain family "sans" of fontconfig, not through the alias system-ui -->
	<alias><family>sans</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
	<alias><family>system-ui</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
	<alias><family>sans-serif</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family><family>Liberation Sans</family></prefer></alias>
	<alias><family>serif</family><prefer><family>DejaVu Serif</family><family>Liberation Serif</family><family>Noto Serif</family></prefer></alias>
	<alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>Liberation Mono</family></prefer></alias>
	<alias><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
	<alias><family>Georgia</family><prefer><family>DejaVu Serif</family><family>Noto Serif</family></prefer></alias>
</fontconfig>
