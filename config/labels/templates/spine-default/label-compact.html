<div class="spine{{#labels.monochrome}} hatched{{/labels.monochrome}}" style="--band: {{classification.color}}">
	<div class="stripe"></div>
	<div class="pic">{{#classification.image_url}}<img class="pictogram" src="{{classification.image_url}}" alt="">{{/classification.image_url}}</div>
	<div class="call"><span class="head">{{call.head}}</span><span class="rest">{{call.rest}}</span></div>
	<div class="level">{{#classification.reading_level}}<div class="class">{{classification.reading_level}}</div>{{/classification.reading_level}}</div>
</div>
