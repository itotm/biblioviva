<div class="face front" style="background-color:#ffffff">
	<div style="position:absolute;left:4mm;top:4mm;width:24mm;height:32mm;background-color:#dddddd">{{#patron.has_photo}}<img src="{{photo_url}}" alt="" style="display:block;width:100%;height:100%;object-fit:cover" />{{/patron.has_photo}}</div>
	<img src="{{#asset}}logo.png{{/asset}}" alt="" style="position:absolute;left:69.6mm;top:4mm;width:12mm;height:12mm;object-fit:contain" />
	<div style="position:absolute;left:31mm;top:5mm;width:37mm;height:10mm;font-family:'DejaVu Serif', Georgia, serif;font-style:italic;font-size:3.2mm">{{library.name}}</div>
	<div style="position:absolute;left:31mm;top:19mm;width:50mm;height:9mm;font-size:3.6mm;line-height:1.25"><span style="color:#777777">{{patron.first_name}}</span><br /><strong>{{patron.last_name}}</strong></div>
	<div style="position:absolute;left:31mm;top:30mm;width:50mm;height:4.5mm;font-size:3.2mm">{{#patron.is_student}}{{patron.class_line}}{{/patron.is_student}}{{#patron.is_teacher}}{{words.teacher}}{{/patron.is_teacher}}</div>
	<div class="bv-barcode" style="position:absolute;left:8mm;top:39mm;width:70mm;height:8mm">{{{barcode_svg}}}</div>
	<div style="position:absolute;left:8mm;top:47.5mm;width:70mm;height:4mm;text-align:center;font-weight:700;font-size:3.4mm;letter-spacing:0.3mm">{{patron.card_number}}</div>
</div>
