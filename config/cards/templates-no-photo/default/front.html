<div class="face front">
	<img src="{{#asset}}logo.png{{/asset}}" alt="" style="position:absolute;left:4mm;top:4mm;width:16mm;height:16mm;object-fit:contain" />
	<div style="position:absolute;left:22mm;top:5mm;width:59mm;height:12mm;text-align:center;font-family:'DejaVu Serif', Georgia, serif;font-style:italic;font-size:4mm">{{library.name}}</div>
