<style>
	/* Layout: a worktable — sticky controls, the live mock of the app beside the seven bars, then
	   every colour set, the hue table and the rules. The page chrome follows the viewer's theme;
	   the mock is always the app's light look (BiblioViva has no dark mode). */
	:root {
		--bg: #f5f6f4;
		--panel: #ffffff;
		--ink: #1d2124;
		--muted: #5c6469;
		--line: #dfe3e1;
		--accent: #2f5d8a;
		--good: #1f7a4d;
		--fair: #8a6a12;
		--poor: #a3402e;
		--display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
		--body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
		--app: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		--mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) {
			--bg: #15191b; --panel: #1e2427; --ink: #e8ecea; --muted: #a2abb0; --line: #323a3e;
			--accent: #8fb6e0; --good: #6fd39f; --fair: #e2c063; --poor: #f29a86; color-scheme: dark;
		}
	}
	:root[data-theme="dark"] {
		--bg: #15191b; --panel: #1e2427; --ink: #e8ecea; --muted: #a2abb0; --line: #323a3e;
		--accent: #8fb6e0; --good: #6fd39f; --fair: #e2c063; --poor: #f29a86; color-scheme: dark;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
	.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 28px; }
	h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
	h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; }
	h2 { font-size: 1.35rem; font-weight: 800; }
	h3 { font-size: 1.05rem; font-weight: 600; }
	p { margin: 0; max-width: 72ch; }
	code { font-family: var(--mono); font-size: 0.86em; background: color-mix(in oklab, var(--line) 55%, transparent); padding: 1px 5px; border-radius: 5px; }
	.lead { color: var(--muted); font-size: 1.05rem; }
	.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
	header.intro { display: grid; gap: 10px; }
	.note { font-size: 0.85rem; color: var(--muted); }

	/* controls */
	.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding-block: 10px; display: grid; gap: 10px; }
	.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
	.label { font-size: 0.8rem; font-weight: 600; color: var(--muted); min-width: 56px; }
	.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
	.seg button { font: inherit; font-size: 0.9rem; border: 0; background: transparent; color: var(--ink); padding: 6px 12px; cursor: pointer; min-height: 36px; }
	.seg button + button { border-left: 1px solid var(--line); }
	.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); font-weight: 600; }
	button:focus-visible, select:focus-visible, tr:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
	.themes { display: flex; flex-wrap: wrap; gap: 6px; }
	.chip { font: inherit; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; min-height: 32px; }
	.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
	.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-block; flex: none; }
	select { font: inherit; font-size: 0.9rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-height: 36px; }

	/* sections */
	section { display: grid; gap: 14px; }
	.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
	.two { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
	@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }

	/* the app mock, with the app's own system font */
	.shot { display: grid; gap: 12px; }
	.app { font-family: var(--app); color: var(--s950); background: var(--s50); border-radius: 12px; overflow: hidden; border: 1px solid var(--s200); display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 330px; }
	.side { background: var(--s50); border-right: 1px solid var(--s200); padding: 12px 10px; display: grid; align-content: start; gap: 4px; }
	.brand { font-weight: 800; color: var(--p700); font-size: 1rem; padding: 4px 6px 10px; border: 0; background: transparent; font-family: inherit; text-align: left; cursor: pointer; }
	.nav { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 10px; font-weight: 600; font-size: 0.86rem; color: var(--s800); cursor: pointer; border: 0; background: transparent; font-family: inherit; text-align: left; }
	.nav .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--p100); color: var(--p700); flex: none; }
	.nav[aria-current="page"] { color: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); }
	.nav[aria-current="page"] .tile { background: rgb(255 255 255 / 0.2); color: #fff; }
	.main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
	.bar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; min-height: 64px; }
	.bar .icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); }
	.bar .title { font-size: 1.45rem; font-weight: 700; line-height: 1.15; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.bar .trail { margin-left: auto; display: flex; align-items: center; gap: 8px; }
	.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.75rem; background: var(--p100); color: var(--p700); }
	.content { padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
	.fake { height: 12px; border-radius: 6px; background: var(--s200); }
	.card { background: #fff; border: 1px solid var(--s200); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
	.btns { display: flex; gap: 8px; flex-wrap: wrap; }
	.btn { padding: 6px 12px; border-radius: 9px; font-weight: 600; font-size: 0.82rem; }
	.phone { font-family: var(--app); justify-self: center; width: min(100%, 360px); background: var(--s50); border: 1px solid var(--s200); border-radius: 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 6px; }
	.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; color: var(--s800); min-width: 0; }
	.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	@media (max-width: 640px) {
		.app { grid-template-columns: 56px minmax(0, 1fr); }
		.nav span.txt, .brand { display: none; }
		.nav { justify-content: center; padding: 6px; }
		.bar .title { font-size: 1.15rem; }
		.bar .trail { display: none; }
	}

	/* the seven bars */
	.bars { display: grid; gap: 8px; }
	.mini { font-family: var(--app); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; min-height: 52px; border: 1px solid var(--s200); cursor: pointer; text-align: left; width: 100%; font-size: 1rem; }
	.mini .icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
	.mini b { font-size: 1.05rem; }
	.mini[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }

	/* checks */
	.pills { display: flex; flex-wrap: wrap; gap: 8px; }
	.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
	.pill.good { color: var(--good); } .pill.fair { color: var(--fair); } .pill.poor { color: var(--poor); }
	.pill svg { width: 14px; height: 14px; flex: none; }

	/* tables */
	.scroll { overflow-x: auto; }
	table.matrix { border-collapse: separate; border-spacing: 4px; font-size: 0.85rem; min-width: 820px; }
	.matrix th { font-weight: 600; color: var(--muted); text-align: left; padding: 2px 6px; white-space: nowrap; font-size: 0.78rem; }
	.matrix td.sw { width: 74px; height: 34px; border-radius: 8px; padding: 0; position: relative; }
	.matrix td.sw span { position: absolute; inset: auto 0 0 0; height: 9px; border-radius: 0 0 8px 8px; }
	.matrix tbody tr { cursor: pointer; }
	.matrix tr.sel th.tn { color: var(--ink); }
	.matrix tr.sel td.sw { box-shadow: 0 0 0 2px var(--ink); }
	.matrix td.meta { white-space: nowrap; padding-left: 8px; }
	table.hues { border-collapse: collapse; font-size: 0.9rem; min-width: 640px; width: 100%; }
	.hues th, .hues td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
	.hues th { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
	.hues td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
	.hues .swatch { display: inline-block; width: 44px; height: 24px; border-radius: 6px; vertical-align: middle; }
	ul.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; max-width: 80ch; }
	ol.history { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; max-width: 80ch; }
	@media (prefers-reduced-motion: no-preference) { .bar, .mini, .nav, .icon, .tab { transition: background-color 0.25s, color 0.25s, box-shadow 0.25s; } }
</style>

<div class="wrap">
	<header class="intro">
		<div class="eyebrow" data-t="eyebrow"></div>

	<section aria-labelledby="h-look">
		<h2 id="h-look" data-t="look"></h2>
		<div class="two">
			<div class="panel shot">
				<div id="app"></div>
				<div class="phone" id="phone"></div>
				<div class="pills" id="pills"></div>
			</div>
			<div class="panel" style="display:grid;gap:10px">
				<h3 data-t="bars"></h3>
				<div class="bars" id="bars"></div>
				<p class="note" data-t="barsNote"></p>
			</div>
		</div>
	</section>

	<section aria-labelledby="h-matrix">
		<h2 id="h-matrix" data-t="matrix"></h2>
		<p class="note" data-t="matrixNote"></p>
		<div class="panel scroll"><table class="matrix" id="matrix"></table></div>
		<p class="note" data-t="distanceNote"></p>
	</section>

	<section aria-labelledby="h-hues">
		<h2 id="h-hues" data-t="hues"></h2>
		<p class="note" data-t="huesNote"></p>
		<div class="panel scroll"><table class="hues" id="hues"></table></div>
	</section>

	<section aria-labelledby="h-rules">
		<h2 id="h-rules" data-t="rules"></h2>
		<div class="panel"><ul class="rules" id="rules"></ul></div>
	</section>

	<section aria-labelledby="h-history">
		<h2 id="h-history" data-t="history"></h2>
		<ol class="history" id="history"></ol>
	</section>
</div>

			return `<button type="button" class="nav" data-area="${a}" ${cur ? 'aria-current="page"' : ""} style="${cur ? `background:${shown(look(state.theme, a).nav)}` : ""}" title="${L().areas[a]}"><span class="tile">${svg(a, 18)}</span><span class="txt">${L().areas[a]}</span></button>`;
		}).join("");
		const app = document.getElementById("app");
		app.innerHTML = `<div class="app" id="app-frame">
			<nav class="side" aria-label="${t().preview}"><button type="button" class="brand" data-area="dashboard">BiblioViva</button>${nav}</nav>
			<div class="main">
				<div class="bar" style="background:${shown(b.bg)};color:${shown(b.ink)};box-shadow:${b.band}">
					<span class="icon" style="background:${shown(b.iconBg)};color:${b.iconInk}">${svg(state.area, 22)}</span>
					<span class="title">${t().mockTitles[state.area]}</span>
					<span class="trail"><span class="avatar">AD</span></span>
				</div>
				<div class="content">
					<div class="card"><div class="fake" style="width:55%"></div><div class="fake" style="width:80%"></div>
						<div class="btns"><span class="btn" style="background:var(--p500);color:#fff">${t().main}</span><span class="btn" style="background:var(--p100);color:var(--p700)">${t().second}</span></div></div>
					<div class="card"><div class="fake" style="width:70%"></div><div class="fake" style="width:40%"></div></div>
				</div>
			</div></div>`;
		setVars(document.getElementById("app-frame"), state.theme);
		app.querySelectorAll("[data-area]").forEach((n) => n.addEventListener("click", () => { state.area = n.dataset.area; update(); }));

		const phone = document.getElementById("phone");
		phone.innerHTML = ["dashboard", ...MOBILE, "more"].map((a) => {
			const cur = a === state.area;
			const style = cur ? `background:${shown(here.tab.bg)};color:${shown(here.tab.ink)}` : "";
			const name = a === "more" ? t().more : L().areas[a];
			return `<div class="tab" style="${style}">${svg(a, 20)}<span>${name}</span></div>`;
		}).join("");
		setVars(phone, state.theme);

		const m = metrics(state.theme);
		const g = grade(m.min);
		document.getElementById("pills").innerHTML = [
			pill(g, t().pillAreas(t().grade[g], fmt(m.min), m.pair.map((a) => L().areas[a]).join(" / "))),
			m.near.d >= 0.07 ? pill("good", t().okStatus) : pill("fair", t().nearStatus(L().areas[m.near.area], t().statusNames[m.near.status])),
			pill(m.icon >= 3 ? "good" : "poor", t().pillIcon(fmt(m.icon))),
			pill(m.text >= 4.5 ? "good" : "poor", t().pillText(fmt(m.text))),
		].join("");
	}

	function renderBars() {
		const bars = document.getElementById("bars");
		bars.innerHTML = ALL.map((a) => {
			const b = look(state.theme, a).bar;
			return `<button type="button" class="mini" data-area="${a}" aria-current="${a === state.area}" style="background:${shown(b.bg)};color:${shown(b.ink)};box-shadow:${b.band}"><span class="icon" style="background:${shown(b.iconBg)};color:${b.iconInk}">${svg(a, 18)}</span><b>${L().areas[a]}</b></button>`;
		}).join("");
		setVars(bars, state.theme);
		bars.querySelectorAll(".mini").forEach((n) => n.addEventListener("click", () => { state.area = n.dataset.area; update(); }));
	}

	function renderMatrix() {
		const head = `<tr><th>${t().th.set}</th>${AREAS.map((a) => `<th>${L().areas[a]}</th>`).join("")}<th>${t().th.minArea}</th><th>${t().th.status}</th><th>${t().th.white}</th></tr>`;
		const rows = Object.entries(DATA.themes).map(([k, th]) => {
			const cells = AREAS.map((a) => `<td class="sw" style="background:${shown(th.areas[a].tint)}" title="${L().themes[k]} · ${L().areas[a]} ${th.areas[a].strong}"><span style="background:${shown(th.areas[a].strong)}"></span></td>`).join("");
			const m = metrics(k);
			const g = grade(m.min);
			return `<tr data-theme="${k}" tabindex="0" class="${k === state.theme ? "sel" : ""}"><th class="tn">${L().themes[k]}</th>${cells}`
				+ `<td class="meta">${pill(g, `${fmt(m.min)} · ${t().grade[g]}`)}</td>`
				+ `<td class="meta">${pill(m.near.d >= 0.07 ? "good" : "fair", `${fmt(m.near.d)} · ${L().areas[m.near.area]}`)}</td>`
				+ `<td class="meta">${pill(m.text >= 4.5 ? "good" : "poor", `${fmt(m.text)}:1`)}</td></tr>`;
		}).join("");
		const table = document.getElementById("matrix");
		table.innerHTML = `<thead>${head}</thead><tbody>${rows}</tbody>`;
		table.querySelectorAll("tbody tr").forEach((tr) => {
			const pick = () => { state.theme = tr.dataset.theme; update(); };
			tr.addEventListener("click", pick);
			tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
		});
	}

	function renderHues() {
		const h = t().hth;
		const th = DATA.themes[state.theme];
		const rows = AREAS.map((a) => {
			const f = DATA.hues[a];
			const c = th.areas[a];
			return `<tr><td><b>${L().areas[a]}</b></td><td><span class="swatch" style="background:${shown(c.strong)}"></span> <code>${c.strong}</code></td><td>${t().hueNames[a]}</td><td class="num">${f.hue}</td><td class="num">${signed(f.shift)}</td><td class="num">${f.chroma === undefined ? t().fromSet : fmt(f.chroma)}</td></tr>`;
		}).join("");
		const status = Object.entries(DATA.status).map(([k, s]) => `<tr><td>${t().statusNames[k]}</td><td><span class="swatch" style="background:${shown(s.color)}"></span> <code>${s.color}</code></td><td></td><td class="num">${s.hue}</td><td></td><td></td></tr>`).join("");
		document.getElementById("hues").innerHTML = `<thead><tr><th>${h.area}</th><th>${h.color}</th><th>${h.name}</th><th>${h.hue}</th><th>${h.shift}</th><th>${h.chroma}</th></tr></thead><tbody>${rows}${status}</tbody>`;
	}

	function renderThemes() {
		const box = document.getElementById("themes");
		box.innerHTML = Object.entries(DATA.themes).map(([k, th]) =>
			`<button type="button" class="chip" data-theme="${k}" id="set-${k}" aria-pressed="${k === state.theme}"><span class="dot" style="background:linear-gradient(135deg, ${shown(th.primary[500])} 50%, ${shown(th.secondary)} 50%)"></span>${L().themes[k]}</button>`).join("");
		box.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { state.theme = b.dataset.theme; update(); }));
	}

	function update() {
		renderText();
		renderThemes();
		renderApp();
		renderBars();
		renderMatrix();
		renderHues();
		save();
	}

	document.querySelectorAll("#lang-seg button").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.v; update(); }));
	document.getElementById("vision").addEventListener("change", (e) => { vision = e.target.value; update(); });
	update();
})();
</script>
